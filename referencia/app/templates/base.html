<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Minutas vivas{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='estilo.css') }}">
</head>
<body>
  <header class="barra">
    <a class="marca" href="/">Minutas <span>vivas</span></a>
    {% if usuario %}
    <form method="post" action="/logout" class="sesion">
      <span>{{ usuario.nombre }}</span>
      <button class="enlace">Salir</button>
    </form>
    {% endif %}
  </header>
  <main class="{% block clase %}{% endblock %}">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
