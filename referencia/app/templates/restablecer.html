{% extends "base.html" %}
{% block titulo %}Nuevo código · Minutas vivas{% endblock %}
{% block clase %}tarjeta{% endblock %}
{% block contenido %}
<h1>Nueva contraseña</h1>
{% if aviso %}<p class="ok">{{ aviso }}</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/restablecer">
  <label>Correo <input type="email" name="email" value="{{ email }}" required></label>
  <label>Código <input name="codigo" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autofocus></label>
  <label>Nueva contraseña <input type="password" name="password" minlength="10" required></label>
  <button>Cambiar contraseña</button>
</form>
<p class="pie"><a href="/olvide">Pedir otro código</a></p>
{% endblock %}
