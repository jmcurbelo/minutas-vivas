{% extends "base.html" %}
{% block titulo %}Entrar · Minutas vivas{% endblock %}
{% block clase %}tarjeta{% endblock %}
{% block contenido %}
<h1>Entrar</h1>
{% if aviso %}<p class="ok">{{ aviso }}</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <label>Correo <input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
  <label>Contraseña <input type="password" name="password" required></label>
  <button>Entrar</button>
</form>
<p class="pie"><a href="/olvide">¿Olvidaste tu contraseña?</a> · <a href="/registro">Crear cuenta</a></p>
{% endblock %}
